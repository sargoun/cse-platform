name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  pruefung:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }

      - run: pnpm install --frozen-lockfile

      # Order matters: the guards are cheap and catch the class of change that
      # is expensive to discover later, so they run before the slow steps.
      - name: Merge-Wachen (Invarianten 1, 2, 5, K-17, D-04)
        run: pnpm guards

      # Das Annahmen-Dokument wird ERZEUGT. Veraltet heisst: der Mandant liest
      # eine Zahl, die im Code nicht mehr gilt — und bestätigt sie.
      - name: Annahmen-Dokument aktuell
        run: pnpm annahmen --check

      # Rechtekatalog und Routen-Manifest werden ebenfalls ERZEUGT, aus den
      # Architekturdokumenten, denen sie gehören (K-19). Veraltet heisst hier:
      # die Rollenprobe läuft über eine Routenliste, die es nicht mehr gibt —
      # sie bestünde, und zwar über nichts.
      - name: Katalog und Routen-Manifest aktuell
        run: pnpm katalog:check && pnpm seitenkarte --check

      - name: Lint
        run: pnpm exec eslint .

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # Die Isolationssuite laeuft als EIGENER Auftrag (`isolation`, unten):
      # sie brauchte hier 25 der 30 Minuten, und Build und Audit warteten auf
      # sie, ohne sie zu brauchen (D-424).

      - name: Build
        run: pnpm build

      # Der Barrierefreiheits- und SEO-Job läuft getrennt (a11y.yml): er
      # braucht einen Browser und einen laufenden Server und dauert um ein
      # Vielfaches länger. Getrennt sagt ein rotes CI sofort, WELCHE Art von
      # Zusage gebrochen ist.

      # SEC-A8: a known-vulnerable dependency fails the branch.
      - name: Audit
        run: pnpm audit --audit-level=high

  # ---------------------------------------------------------------------------
  # Die Isolationssuite — RLS am echten Postgres, als cse_app und nie als
  # Eigentuemer. Ein Mock beweist nichts.
  #
  # **Ein eigener Auftrag, parallel zu `pruefung`** (D-424). Sie ist der
  # laengste Schritt der Pruefung; hinter Lint und Typecheck eingereiht liess
  # sie Build und Audit 25 Minuten warten, ohne dass die etwas von ihr
  # brauchten. Nebeneinander entscheidet die laengere Haelfte — und die ist
  # jetzt die Suite selbst, die ihre 69 Dateien auf vier Arbeiter mit je
  # eigener Datenbank verteilt (`tests/isolation/global-setup.ts`).
  #
  # Postgres als DIENST-CONTAINER, nicht per `su` gestartet: ihn im Job
  # hochzufahren hiesse, als `postgres` zu arbeiten — auf einem Runner ist das
  # eine Rechtefrage, die genau einmal falsch beantwortet wird. Der Dienst
  # laeuft schon, und `scripts/test-db.sh` erkennt das und legt nur noch die
  # Datenbank an.
  # ---------------------------------------------------------------------------
  isolation:
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector statt des nackten Postgres: `wissens_chunk` (AGT-06) traegt
        # eine `vector`-Spalte, und ohne die Erweiterung scheitert Migration
        # 0151. Das Bild IST postgres:16, nur mit der Erweiterung darin — kein
        # anderer Server, keine andere Fassung (D-496).
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          # Wegwerf-Datenbank in einem Wegwerf-Container, nur über localhost
          # erreichbar. Ein Passwort hier wäre eines mehr, das in Logs landet.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }

      - run: pnpm install --frozen-lockfile

      - name: Isolation suite (RLS, FORCE, K-04, K-05, K-18, K-20)
        run: |
          pnpm db:test:up
          pnpm test:isolation
