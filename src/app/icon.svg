<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    Das App-Symbol (Favicon): das Gruppenzeichen aus DESIGN §1 „Marks and
    logos" — vier Punkte in den vier Identitaetsfarben auf einer Kachel in
    Ink. Vier Gesellschaften, ein Haus.

    Die Werte stehen hier als Hex, weil ein Favicon keine CSS-Variablen
    kennt; sie sind DIESELBEN wie in `src/lib/design/theme.ts` (ink,
    border-strong, area-reinigung/security/bau/operations) und aendern sich
    nur dort. Bis das offizielle Logo vorliegt (O-12) ist das Zeichen
    vorlaeufig — dasselbe wie in `components/marke/Marke.tsx`.
  -->
  <rect width="64" height="64" rx="16" fill="#08080A"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="15.5" fill="none" stroke="#34343C"/>
  <circle cx="22.7" cy="22.7" r="8" fill="#E30613"/>
  <circle cx="41.3" cy="22.7" r="8" fill="#2F6BFF"/>
  <circle cx="22.7" cy="41.3" r="8" fill="#F59E0B"/>
  <circle cx="41.3" cy="41.3" r="8" fill="#8B5CF6"/>
</svg>
