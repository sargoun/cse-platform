<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2560 1440" width="2560" height="1440"
     role="img" aria-label="Motivtafel — hier steht spaeter eine Aufnahme von der Baustelle.">
  <!--
    Motivtafel, kein Bild (DESIGN §4.1a, D-376). Sie ist erkennbar eine
    Zeichnung: flache Flaechen, keine Fototiefe, Figuren als Silhouette ohne
    Gesicht (§4.2). Sie haelt den Platz sichtbar frei und behauptet nichts.
    Liegt eine Datei unter public/bilder/bau.*, gewinnt die. O-13.
    Erzeugt von scripts/motivtafeln.py — nicht von Hand aendern.
  -->
  <defs>
    <linearGradient id="grund" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1F1F24"/>
      <stop offset="0.55" stop-color="#17171B"/>
      <stop offset="1" stop-color="#101013"/>
    </linearGradient>
    <radialGradient id="schein" cx="0.5" cy="0.22" r="0.78">
      <stop offset="0" stop-color="#F59E0B" stop-opacity="0.16"/>
      <stop offset="0.55" stop-color="#F59E0B" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="overlay" x1="0" y1="0" x2="0" y2="1">
      <!-- derselbe Verlauf wie `--bild-overlay` in DESIGN §4.4, hier
           ausgeschrieben: eine SVG-Datei sieht die CSS-Variablen des
           Dokuments nicht. -->
      <stop offset="0" stop-color="#08080A" stop-opacity="0.15"/>
      <stop offset="0.55" stop-color="#08080A" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#08080A" stop-opacity="0.92"/>
    </linearGradient>
  </defs>

  <rect width="2560" height="1440" fill="url(#grund)"/>
  <rect width="2560" height="1440" fill="url(#schein)"/>

  <!-- Ferne: der Bestand, zwischen dem gebaut wird. -->
  <g fill="#1C1C21">
    <rect x="0" y="640" width="300" height="370"/>
    <rect x="330" y="720" width="220" height="290"/>
    <rect x="2080" y="660" width="260" height="350"/>
    <rect x="2360" y="730" width="200" height="280"/>
  </g>
  <defs>
    <linearGradient id="buehne430" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F59E0B" stop-opacity="0"/>
      <stop offset="0.62" stop-color="#F59E0B" stop-opacity="0.085"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0.13"/>
    </linearGradient>
  </defs>
  <rect x="0" y="430" width="2560" height="580" fill="url(#buehne430)"/>
  <rect x="0" y="1007" width="2560" height="3" fill="#F59E0B" opacity="0.55"/>
  <rect x="0" y="1010" width="2560" height="430" fill="#0B0B0E"/>

  <!-- Mitte: Rohbau im Geruest. Das Geruest IST das Motiv. -->
  <rect x="760" y="300" width="800" height="710" fill="#131318"/>
  <g stroke="#34343C" stroke-width="7" fill="none">
    <line x1="742" y1="360" x2="1578" y2="360"/>
    <line x1="742" y1="478" x2="1578" y2="478"/>
    <line x1="742" y1="596" x2="1578" y2="596"/>
    <line x1="742" y1="714" x2="1578" y2="714"/>
    <line x1="742" y1="832" x2="1578" y2="832"/>
    <line x1="742" y1="950" x2="1578" y2="950"/>
    <line x1="760" y1="300" x2="760" y2="1010"/>
    <line x1="874" y1="300" x2="874" y2="1010"/>
    <line x1="988" y1="300" x2="988" y2="1010"/>
    <line x1="1102" y1="300" x2="1102" y2="1010"/>
    <line x1="1216" y1="300" x2="1216" y2="1010"/>
    <line x1="1330" y1="300" x2="1330" y2="1010"/>
    <line x1="1444" y1="300" x2="1444" y2="1010"/>
    <line x1="1558" y1="300" x2="1558" y2="1010"/>
  </g>
  <g stroke="#26262C" stroke-width="4" opacity="0.8">
    <line x1="760" y1="478" x2="874" y2="360"/>
    <line x1="1446" y1="478" x2="1560" y2="360"/>
    <line x1="760" y1="714" x2="874" y2="596"/>
    <line x1="1446" y1="714" x2="1560" y2="596"/>
    <line x1="760" y1="950" x2="874" y2="832"/>
    <line x1="1446" y1="950" x2="1560" y2="832"/>
  </g>
  <rect x="742" y="294" width="836" height="8" fill="#F59E0B" opacity="0.9"/>
  <g fill="#131318" opacity="0.7">
    <rect x="790" y="370" width="340" height="94"/>
    <rect x="1020" y="488" width="340" height="94"/>
    <rect x="790" y="606" width="340" height="94"/>
    <rect x="1020" y="724" width="340" height="94"/>
    <rect x="790" y="842" width="340" height="94"/>
  </g>
  <!-- Der Kran: das eine Element, an dem jeder eine Baustelle erkennt. -->
  <g fill="#0B0B0E">
    <rect x="1940" y="210" width="30" height="800"/>
    <rect x="1500" y="196" width="900" height="24"/>
    <rect x="1918" y="130" width="74" height="72"/>
  </g>
  <g stroke="#0B0B0E" stroke-width="9" fill="none">
    <path d="M 1955 130 L 1560 204"/>
    <path d="M 1955 130 L 2370 204"/>
  </g>
  <line x1="1700" y1="220" x2="1700" y2="690" stroke="#0B0B0E" stroke-width="5"/>
  <rect x="1654" y="690" width="92" height="70" fill="#0B0B0E"/>
  <!-- Vorn: Paletten und zwei Silhouetten bei der Arbeit. -->
  <g fill="#0B0B0E">
    <rect x="1810" y="976" width="300" height="30"/>
    <rect x="1818" y="942" width="300" height="30"/>
    <rect x="1826" y="908" width="300" height="30"/>
    <rect x="1834" y="874" width="300" height="30"/>
  </g>
  <g fill="#0B0B0E">
    <circle cx="470" cy="702" r="25.2" fill="#0B0B0E"/>
    <path d="M 424 737 L 516 737 L 526 870 L 414 870 Z" fill="#0B0B0E"/>
    <rect x="418" y="863" width="38" height="147" fill="#0B0B0E"/>
    <rect x="484" y="863" width="38" height="147" fill="#0B0B0E"/>
    <rect x="512" y="744" width="32" height="119" fill="#0B0B0E" transform="rotate(18 470 765)"/>
    <path d="M 435 695 a 35.0 35.0 0 0 1 70 0 Z" fill="#F59E0B"/>
    <circle cx="660" cy="727" r="23.2" fill="#0B0B0E"/>
    <path d="M 618 759 L 702 759 L 712 881 L 608 881 Z" fill="#0B0B0E"/>
    <rect x="612" y="875" width="35" height="135" fill="#0B0B0E"/>
    <rect x="673" y="875" width="35" height="135" fill="#0B0B0E"/>
    <rect x="621" y="765" width="29" height="109" fill="#0B0B0E" transform="rotate(-18 660 785)"/>
    <path d="M 628 720 a 32.2 32.2 0 0 1 64 0 Z" fill="#F59E0B"/>
  </g>
  <rect x="672" y="680" width="9" height="330" fill="#0B0B0E"/>
  <rect width="2560" height="1440" fill="url(#overlay)"/>

  <!-- Die Akzentlinie: sechs Pixel, die Gesellschaft, sonst nichts. -->
  <rect x="128" y="1204" width="112" height="6" fill="#F59E0B"/>
  <text x="128" y="1280" fill="#FAFAFA"
        font-family="Inter, system-ui, sans-serif" font-size="46" font-weight="600"
        letter-spacing="4">REALTIME SERVICE</text>
  <text x="128" y="1336" fill="#8B8B95"
        font-family="Inter, system-ui, sans-serif" font-size="30" font-weight="400">Hier steht spaeter eine Aufnahme von der Baustelle.</text>
  <text x="2432" y="1336" fill="#8B8B95" text-anchor="end"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26"
        letter-spacing="3">PLATZHALTER · O-13</text>
</svg>
