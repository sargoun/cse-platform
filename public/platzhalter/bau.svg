<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2560 1440" width="2560" height="1440"
     role="img" aria-label="Motivtafel — hier steht spaeter eine Aufnahme von der Baustelle.">
  <!--
    Motivtafel, kein Bild (DESIGN §4.1a, D-376). Sie ist erkennbar eine
    Zeichnung: flache Flaechen, keine Fototiefe, Figuren als Silhouette ohne
    Gesicht (§4.2). Sie haelt den Platz sichtbar frei und behauptet nichts.
    Liegt eine Datei unter public/bilder/bau.*, gewinnt die. O-13.
    Erzeugt von scripts/motivtafeln.py — nicht von Hand aendern.
  -->
  <defs>
    <!-- Der Tafel-Verlauf aus DESIGN §4.1b, nicht der UI-Flaechenverlauf aus
         §1. Warum das zwei verschiedene sind, steht oben bei HIMMEL. -->
    <linearGradient id="grund" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#33333C"/>
      <stop offset="0.55" stop-color="#2C2C34"/>
      <stop offset="1" stop-color="#0C0C10"/>
    </linearGradient>
    <radialGradient id="schein" cx="0.5" cy="0.22" r="0.78">
      <stop offset="0" stop-color="#F59E0B" stop-opacity="0.16"/>
      <stop offset="0.55" stop-color="#F59E0B" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="2560" height="1440" fill="url(#grund)"/>
  <rect width="2560" height="1440" fill="url(#schein)"/>

  <!-- Ferne: der Bestand, zwischen dem gebaut wird. -->
  <g fill="#4A4A56">
    <rect x="0" y="640" width="340" height="370"/>
    <rect x="340" y="720" width="300" height="290"/>
    <rect x="2060" y="660" width="280" height="350"/>
    <rect x="2340" y="730" width="220" height="280"/>
  </g>
  <defs>
    <linearGradient id="buehne430" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F59E0B" stop-opacity="0"/>
      <stop offset="0.62" stop-color="#F59E0B" stop-opacity="0.085"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0.13"/>
    </linearGradient>
  </defs>
  <rect x="0" y="430" width="2560" height="580" fill="url(#buehne430)"/>
  <rect x="0" y="1007" width="2560" height="3" fill="#F59E0B" opacity="0.55"/>
  <rect x="0" y="1010" width="2560" height="430" fill="#0C0C10"/>

  <!-- Mitte: Rohbau im Geruest. Das Geruest IST das Motiv. -->
  <rect x="700" y="300" width="760" height="710" fill="#2C2C34"/>
  <g stroke="#34343C" stroke-width="7" fill="none">
    <line x1="682" y1="360" x2="1478" y2="360"/>
    <line x1="682" y1="478" x2="1478" y2="478"/>
    <line x1="682" y1="596" x2="1478" y2="596"/>
    <line x1="682" y1="714" x2="1478" y2="714"/>
    <line x1="682" y1="832" x2="1478" y2="832"/>
    <line x1="682" y1="950" x2="1478" y2="950"/>
    <line x1="700" y1="300" x2="700" y2="1010"/>
    <line x1="808" y1="300" x2="808" y2="1010"/>
    <line x1="916" y1="300" x2="916" y2="1010"/>
    <line x1="1024" y1="300" x2="1024" y2="1010"/>
    <line x1="1132" y1="300" x2="1132" y2="1010"/>
    <line x1="1240" y1="300" x2="1240" y2="1010"/>
    <line x1="1348" y1="300" x2="1348" y2="1010"/>
    <line x1="1456" y1="300" x2="1456" y2="1010"/>
  </g>
  <g stroke="#26262C" stroke-width="4" opacity="0.8">
    <line x1="700" y1="478" x2="808" y2="360"/>
    <line x1="1352" y1="478" x2="1460" y2="360"/>
    <line x1="700" y1="714" x2="808" y2="596"/>
    <line x1="1352" y1="714" x2="1460" y2="596"/>
    <line x1="700" y1="950" x2="808" y2="832"/>
    <line x1="1352" y1="950" x2="1460" y2="832"/>
  </g>
  <rect x="682" y="294" width="796" height="8" fill="#F59E0B" opacity="0.9"/>
  <g fill="#2C2C34" opacity="0.7">
    <rect x="730" y="370" width="320" height="94"/>
    <rect x="950" y="488" width="320" height="94"/>
    <rect x="730" y="606" width="320" height="94"/>
    <rect x="950" y="724" width="320" height="94"/>
    <rect x="730" y="842" width="320" height="94"/>
  </g>
  <!-- Der Kran: das eine Element, an dem jeder eine Baustelle erkennt. -->
  <g fill="#14141A">
    <rect x="1700" y="210" width="30" height="800"/>
    <rect x="1280" y="196" width="880" height="24"/>
    <rect x="1678" y="130" width="74" height="72"/>
  </g>
  <g stroke="#14141A" stroke-width="9" fill="none">
    <path d="M 1715 130 L 1330 204"/>
    <path d="M 1715 130 L 2130 204"/>
  </g>
  <line x1="1470" y1="220" x2="1470" y2="690" stroke="#14141A" stroke-width="5"/>
  <rect x="1424" y="690" width="92" height="70" fill="#14141A"/>
  <!-- Vorn: Paletten und zwei Silhouetten bei der Arbeit. -->
  <g fill="#14141A">
    <rect x="1520" y="976" width="280" height="30"/>
    <rect x="1528" y="942" width="280" height="30"/>
    <rect x="1536" y="908" width="280" height="30"/>
    <rect x="1544" y="874" width="280" height="30"/>
  </g>
  <g fill="#14141A">
    <circle cx="900" cy="702" r="25.2" fill="#14141A"/>
    <path d="M 854 737 L 946 737 L 956 870 L 844 870 Z" fill="#14141A"/>
    <rect x="848" y="863" width="38" height="147" fill="#14141A"/>
    <rect x="914" y="863" width="38" height="147" fill="#14141A"/>
    <rect x="942" y="744" width="32" height="119" fill="#14141A" transform="rotate(18 900 765)"/>
    <path d="M 865 695 a 35.0 35.0 0 0 1 70 0 Z" fill="#F59E0B"/>
    <circle cx="1120" cy="727" r="23.2" fill="#14141A"/>
    <path d="M 1078 759 L 1162 759 L 1172 881 L 1068 881 Z" fill="#14141A"/>
    <rect x="1072" y="875" width="35" height="135" fill="#14141A"/>
    <rect x="1133" y="875" width="35" height="135" fill="#14141A"/>
    <rect x="1081" y="765" width="29" height="109" fill="#14141A" transform="rotate(-18 1120 785)"/>
    <path d="M 1088 720 a 32.2 32.2 0 0 1 64 0 Z" fill="#F59E0B"/>
  </g>
  <rect x="1132" y="680" width="9" height="330" fill="#14141A"/>
</svg>
