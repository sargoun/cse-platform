<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2560 1440" width="2560" height="1440"
     role="img" aria-label="Motivtafel — hier steht spaeter eine Aufnahme aus der Unterhaltsreinigung.">
  <!--
    Motivtafel, kein Bild (DESIGN §4.1a, D-376). Sie ist erkennbar eine
    Zeichnung: flache Flaechen, keine Fototiefe, Figuren als Silhouette ohne
    Gesicht (§4.2). Sie haelt den Platz sichtbar frei und behauptet nichts.
    Liegt eine Datei unter public/bilder/reinigung.*, gewinnt die. O-13.
    Erzeugt von scripts/motivtafeln.py — nicht von Hand aendern.
  -->
  <defs>
    <linearGradient id="grund" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1F1F24"/>
      <stop offset="0.55" stop-color="#17171B"/>
      <stop offset="1" stop-color="#101013"/>
    </linearGradient>
    <radialGradient id="schein" cx="0.5" cy="0.22" r="0.78">
      <stop offset="0" stop-color="#E30613" stop-opacity="0.16"/>
      <stop offset="0.55" stop-color="#E30613" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#E30613" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="overlay" x1="0" y1="0" x2="0" y2="1">
      <!-- derselbe Verlauf wie `--bild-overlay` in DESIGN §4.4, hier
           ausgeschrieben: eine SVG-Datei sieht die CSS-Variablen des
           Dokuments nicht. -->
      <stop offset="0" stop-color="#08080A" stop-opacity="0.15"/>
      <stop offset="0.55" stop-color="#08080A" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#08080A" stop-opacity="0.92"/>
    </linearGradient>
  </defs>

  <rect width="2560" height="1440" fill="url(#grund)"/>
  <rect width="2560" height="1440" fill="url(#schein)"/>

  <!-- Ein Flur in der Flucht. Fluchtpunkt hoch genug, dass der Boden -->
  <!-- traegt und die Figur nicht im Overlay verschwindet. -->
  <rect x="0" y="0" width="2560" height="1440" fill="#17171B" opacity="0.0"/>
  <path d="M 0 0 L 0 1440 L 900 980 L 900 440 Z" fill="#1C1C21"/>
  <path d="M 2560 0 L 2560 1440 L 1660 980 L 1660 440 Z" fill="#1C1C21"/>
  <rect x="900" y="440" width="760" height="540" fill="#131318"/>
  <rect x="900" y="432" width="760" height="10" fill="#E30613" opacity="0.85"/>
  <rect x="1020" y="520" width="520" height="300" fill="#E30613" opacity="0.13"/>
  <!-- Fensterband links: das Licht, das einen Flur ausmacht. -->
  <g fill="#E30613" opacity="0.11">
    <path d="M 40 200 L 160 250 L 160 1136 L 40 1180 Z"/>
    <path d="M 216 250 L 336 300 L 336 1092 L 216 1136 Z"/>
    <path d="M 392 300 L 512 350 L 512 1048 L 392 1092 Z"/>
    <path d="M 568 350 L 688 400 L 688 1004 L 568 1048 Z"/>
    <path d="M 744 400 L 864 450 L 864 960 L 744 1004 Z"/>
  </g>
  <!-- Boden: Fugenraster in der Flucht plus flache Spiegelbaender. -->
  <path d="M 0 1440 L 900 980 L 1660 980 L 2560 1440 Z" fill="#0B0B0E"/>
  <g stroke="#26262C" stroke-width="3" opacity="0.45">
    <line x1="0" y1="1440" x2="900" y2="982"/>
    <line x1="256" y1="1440" x2="976" y2="982"/>
    <line x1="512" y1="1440" x2="1052" y2="982"/>
    <line x1="768" y1="1440" x2="1128" y2="982"/>
    <line x1="1024" y1="1440" x2="1204" y2="982"/>
    <line x1="1280" y1="1440" x2="1280" y2="982"/>
    <line x1="1536" y1="1440" x2="1356" y2="982"/>
    <line x1="1792" y1="1440" x2="1432" y2="982"/>
    <line x1="2048" y1="1440" x2="1508" y2="982"/>
    <line x1="2304" y1="1440" x2="1584" y2="982"/>
    <line x1="2560" y1="1440" x2="1660" y2="982"/>
    <line x1="0" y1="990" x2="2560" y2="990"/>
    <line x1="0" y1="1004" x2="2560" y2="1004"/>
    <line x1="0" y1="1026" x2="2560" y2="1026"/>
    <line x1="0" y1="1060" x2="2560" y2="1060"/>
    <line x1="0" y1="1110" x2="2560" y2="1110"/>
    <line x1="0" y1="1186" x2="2560" y2="1186"/>
    <line x1="0" y1="1300" x2="2560" y2="1300"/>
  </g>
  <g fill="#E30613" opacity="0.10">
    <rect x="1200" y="1000" width="160" height="8" rx="5"/>
    <rect x="1085" y="1074" width="390" height="10" rx="5"/>
    <rect x="970" y="1148" width="620" height="12" rx="5"/>
    <rect x="855" y="1222" width="850" height="14" rx="5"/>
    <rect x="740" y="1296" width="1080" height="16" rx="5"/>
    <rect x="625" y="1370" width="1310" height="18" rx="5"/>
  </g>
  <!-- Vorn: eine Figur mit Reinigungswagen, gross genug zum Erkennen. -->
  <g fill="#0B0B0E">
    <rect x="1690" y="700" width="250" height="22" rx="9"/>
    <rect x="1696" y="720" width="16" height="250"/>
    <rect x="1918" y="720" width="16" height="250"/>
    <rect x="1690" y="856" width="250" height="18" rx="7"/>
    <rect x="1732" y="874" width="76" height="98" rx="8"/>
    <rect x="1846" y="876" width="60" height="96" rx="6"/>
    <circle cx="1712" cy="994" r="24"/>
    <circle cx="1918" cy="994" r="24"/>
    <rect x="1852" y="520" width="13" height="184"/>
    <circle cx="1520" cy="676" r="27.4" fill="#0B0B0E"/>
    <path d="M 1471 714 L 1569 714 L 1581 858 L 1459 858 Z" fill="#0B0B0E"/>
    <rect x="1463" y="850" width="42" height="160" fill="#0B0B0E"/>
    <rect x="1535" y="850" width="42" height="160" fill="#0B0B0E"/>
    <rect x="1566" y="721" width="34" height="129" fill="#0B0B0E" transform="rotate(18 1520 744)"/>
  </g>
  <rect width="2560" height="1440" fill="url(#overlay)"/>

  <!-- Die Akzentlinie: sechs Pixel, die Gesellschaft, sonst nichts. -->
  <rect x="128" y="1204" width="112" height="6" fill="#E30613"/>
  <text x="128" y="1280" fill="#FAFAFA"
        font-family="Inter, system-ui, sans-serif" font-size="46" font-weight="600"
        letter-spacing="4">CSE DIENSTLEISTUNG</text>
  <text x="128" y="1336" fill="#8B8B95"
        font-family="Inter, system-ui, sans-serif" font-size="30" font-weight="400">Hier steht spaeter eine Aufnahme aus der Unterhaltsreinigung.</text>
  <text x="2432" y="1336" fill="#8B8B95" text-anchor="end"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26"
        letter-spacing="3">PLATZHALTER · O-13</text>
</svg>
