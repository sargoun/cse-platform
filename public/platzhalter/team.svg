<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2560 1440" width="2560" height="1440"
     role="img" aria-label="Motivtafel — hier steht spaeter eine Aufnahme des Teams.">
  <!--
    Motivtafel, kein Bild (DESIGN §4.1a, D-376). Sie ist erkennbar eine
    Zeichnung: flache Flaechen, keine Fototiefe, Figuren als Silhouette ohne
    Gesicht (§4.2). Sie haelt den Platz sichtbar frei und behauptet nichts.
    Liegt eine Datei unter public/bilder/team.*, gewinnt die. O-13.
    Erzeugt von scripts/motivtafeln.py — nicht von Hand aendern.
  -->
  <defs>
    <!-- Der Tafel-Verlauf aus DESIGN §4.1b, nicht der UI-Flaechenverlauf aus
         §1. Warum das zwei verschiedene sind, steht oben bei HIMMEL. -->
    <linearGradient id="grund" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#33333C"/>
      <stop offset="0.55" stop-color="#2C2C34"/>
      <stop offset="1" stop-color="#0C0C10"/>
    </linearGradient>
    <radialGradient id="schein" cx="0.5" cy="0.22" r="0.78">
      <stop offset="0" stop-color="#E30613" stop-opacity="0.16"/>
      <stop offset="0.55" stop-color="#E30613" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#E30613" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="2560" height="1440" fill="url(#grund)"/>
  <rect width="2560" height="1440" fill="url(#schein)"/>

  <defs>
    <linearGradient id="buehne400" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E30613" stop-opacity="0"/>
      <stop offset="0.62" stop-color="#E30613" stop-opacity="0.085"/>
      <stop offset="1" stop-color="#E30613" stop-opacity="0.13"/>
    </linearGradient>
  </defs>
  <rect x="0" y="400" width="2560" height="610" fill="url(#buehne400)"/>
  <rect x="0" y="1007" width="2560" height="3" fill="#E30613" opacity="0.55"/>
  <rect x="0" y="1010" width="2560" height="430" fill="#0C0C10"/>

  <!-- Eine Wand aus Lamellen, damit die Reihe VOR etwas steht — und -->
  <!-- zwar vor etwas Hellerem: sonst ist eine dunkle Silhouette auf -->
  <!-- dunklem Grund keine Silhouette, sondern ein Fleck. -->
  <g fill="#1F1F24">
    <rect x="60" y="330" width="112" height="680" rx="6"/>
    <rect x="236" y="330" width="112" height="680" rx="6"/>
    <rect x="412" y="330" width="112" height="680" rx="6"/>
    <rect x="588" y="330" width="112" height="680" rx="6"/>
    <rect x="764" y="330" width="112" height="680" rx="6"/>
    <rect x="940" y="330" width="112" height="680" rx="6"/>
    <rect x="1116" y="330" width="112" height="680" rx="6"/>
    <rect x="1292" y="330" width="112" height="680" rx="6"/>
    <rect x="1468" y="330" width="112" height="680" rx="6"/>
    <rect x="1644" y="330" width="112" height="680" rx="6"/>
    <rect x="1820" y="330" width="112" height="680" rx="6"/>
    <rect x="1996" y="330" width="112" height="680" rx="6"/>
    <rect x="2172" y="330" width="112" height="680" rx="6"/>
    <rect x="2348" y="330" width="112" height="680" rx="6"/>
    <rect x="2524" y="330" width="112" height="680" rx="6"/>
  </g>
  <g fill="#E30613" opacity="0.07">
    <rect x="60" y="330" width="112" height="680" rx="6"/>
    <rect x="236" y="330" width="112" height="680" rx="6"/>
    <rect x="412" y="330" width="112" height="680" rx="6"/>
    <rect x="588" y="330" width="112" height="680" rx="6"/>
    <rect x="764" y="330" width="112" height="680" rx="6"/>
    <rect x="940" y="330" width="112" height="680" rx="6"/>
    <rect x="1116" y="330" width="112" height="680" rx="6"/>
    <rect x="1292" y="330" width="112" height="680" rx="6"/>
    <rect x="1468" y="330" width="112" height="680" rx="6"/>
    <rect x="1644" y="330" width="112" height="680" rx="6"/>
    <rect x="1820" y="330" width="112" height="680" rx="6"/>
    <rect x="1996" y="330" width="112" height="680" rx="6"/>
    <rect x="2172" y="330" width="112" height="680" rx="6"/>
    <rect x="2348" y="330" width="112" height="680" rx="6"/>
    <rect x="2524" y="330" width="112" height="680" rx="6"/>
  </g>
  <!-- Sieben Silhouetten, unterschiedlich gross. Kein Gesicht (§4.2): -->
  <!-- die Reihe zeigt eine Belegschaft, sie behauptet keine Person. -->
  <g fill="#08080A">
