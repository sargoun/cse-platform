<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2560 1440" width="2560" height="1440"
     role="img" aria-label="Motivtafel — hier steht spaeter eine Aufnahme aus dem Betrieb.">
  <!--
    Motivtafel, kein Bild (DESIGN §4.1a, D-376). Sie ist erkennbar eine
    Zeichnung: flache Flaechen, keine Fototiefe, Figuren als Silhouette ohne
    Gesicht (§4.2). Sie haelt den Platz sichtbar frei und behauptet nichts.
    Liegt eine Datei unter public/bilder/operations.*, gewinnt die. O-13.
    Erzeugt von scripts/motivtafeln.py — nicht von Hand aendern.
  -->
  <defs>
    <!-- Der Tafel-Verlauf aus DESIGN §4.1b, nicht der UI-Flaechenverlauf aus
         §1. Warum das zwei verschiedene sind, steht oben bei HIMMEL. -->
    <linearGradient id="grund" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#33333C"/>
      <stop offset="0.55" stop-color="#2C2C34"/>
      <stop offset="1" stop-color="#0C0C10"/>
    </linearGradient>
    <radialGradient id="schein" cx="0.5" cy="0.22" r="0.78">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.16"/>
      <stop offset="0.55" stop-color="#8B5CF6" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="overlay" x1="0" y1="0" x2="0" y2="1">
      <!-- derselbe Verlauf wie der Bild-Overlay-Token in DESIGN §4.4, hier
           ausgeschrieben: eine SVG-Datei sieht die CSS-Variablen des
           Dokuments nicht.

           Der Tokenname steht hier BEWUSST ohne seine beiden fuehrenden
           Bindestriche: ein XML-Kommentar darf keinen doppelten Bindestrich
           enthalten, und eine SVG ist XML. Mit ihnen war jede der acht
           Tafeln nicht wohlgeformt; der Browser lud sie mit 200 und
           zeichnete ein kaputtes Bild. Die Datei sah im Editor richtig aus
           und war es nie. -->
      <stop offset="0" stop-color="#08080A" stop-opacity="0.15"/>
      <stop offset="0.55" stop-color="#08080A" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#08080A" stop-opacity="0.92"/>
    </linearGradient>
  </defs>

  <rect width="2560" height="1440" fill="url(#grund)"/>
  <rect width="2560" height="1440" fill="url(#schein)"/>

  <defs>
    <linearGradient id="buehne560" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0"/>
      <stop offset="0.62" stop-color="#8B5CF6" stop-opacity="0.085"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0.13"/>
    </linearGradient>
  </defs>
  <rect x="0" y="560" width="2560" height="450" fill="url(#buehne560)"/>
  <rect x="0" y="1007" width="2560" height="3" fill="#8B5CF6" opacity="0.55"/>
  <rect x="0" y="1010" width="2560" height="430" fill="#0C0C10"/>

  <!-- Die Leitstelle: drei Wandtafeln, Tisch, eine Person davor. -->
  <g fill="#2C2C34" stroke="#34343C" stroke-width="4">
    <rect x="230" y="250" width="560" height="380" rx="14"/>
    <rect x="860" y="200" width="700" height="430" rx="14"/>
    <rect x="1630" y="270" width="620" height="360" rx="14"/>
  </g>
  <!-- Was auf den Tafeln steht: Balken und eine Linie. Keine Zahl, die -->
  <!-- jemand fuer eine Auskunft halten koennte (Inv. 6). -->
  <g fill="#8B5CF6" opacity="0.65">
    <rect x="286" y="458" width="42" height="120" rx="6"/>
    <rect x="356" y="378" width="42" height="200" rx="6"/>
    <rect x="426" y="488" width="42" height="90" rx="6"/>
    <rect x="496" y="316" width="42" height="262" rx="6"/>
    <rect x="566" y="418" width="42" height="160" rx="6"/>
    <rect x="636" y="354" width="42" height="224" rx="6"/>
    <rect x="706" y="446" width="42" height="132" rx="6"/>
  </g>
  <polyline points="910,548 1030,462 1150,506 1270,372 1390,428 1510,306" fill="none" stroke="#8B5CF6" stroke-width="9" opacity="0.85" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#8B5CF6" opacity="0.25">
    <rect x="1686" y="330" width="450" height="20" rx="10"/>
    <rect x="1686" y="382" width="320" height="20" rx="10"/>
    <rect x="1686" y="434" width="450" height="20" rx="10"/>
    <rect x="1686" y="486" width="320" height="20" rx="10"/>
    <rect x="1686" y="538" width="450" height="20" rx="10"/>
  </g>
  <rect x="860" y="192" width="700" height="10" fill="#8B5CF6" opacity="0.9"/>
  <!-- Tisch und Figur, beide VOR den Tafeln. -->
  <g fill="#14141A">
    <rect x="780" y="884" width="820" height="126" rx="10"/>
    <rect x="940" y="820" width="240" height="64" rx="10"/>
    <rect x="1034" y="792" width="52" height="30"/>
    <circle cx="1560" cy="728" r="23.0" fill="#14141A"/>
    <path d="M 1518 760 L 1602 760 L 1611 882 L 1509 882 Z" fill="#14141A"/>
    <rect x="1512" y="876" width="35" height="134" fill="#14141A"/>
    <rect x="1573" y="876" width="35" height="134" fill="#14141A"/>
    <rect x="1522" y="767" width="29" height="109" fill="#14141A" transform="rotate(-18 1560 786)"/>
  </g>
  <rect width="2560" height="1440" fill="url(#overlay)"/>

  <!-- Die Akzentlinie: sechs Pixel, die Gesellschaft, sonst nichts. -->
  <rect x="128" y="1204" width="112" height="6" fill="#8B5CF6"/>
  <text x="128" y="1280" fill="#FAFAFA"
        font-family="Inter, system-ui, sans-serif" font-size="46" font-weight="600"
        letter-spacing="4">CSE OPERATIONS</text>
  <text x="128" y="1336" fill="#8B8B95"
        font-family="Inter, system-ui, sans-serif" font-size="30" font-weight="400">Hier steht spaeter eine Aufnahme aus dem Betrieb.</text>
  <text x="2432" y="1336" fill="#8B8B95" text-anchor="end"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26"
        letter-spacing="3">PLATZHALTER · O-13</text>
</svg>
